<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liverpool貯金</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f4f7; color: #333; margin: 0; padding: 10px; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    
    /* ヘッダー */
    header { background: #c8102e; color: #fff; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 1.5rem; }
    
    /* 画面切り替え */
    .view-section { display: none; }
    .view-section.active { display: block; }
    
    /* 金額表示 */
    .dashboard { display: flex; gap: 10px; margin-bottom: 20px; }
    .total-box { flex: 1; background: #e02030; color: #fff; padding: 15px; border-radius: 8px; text-align: center; }
    .unsettled-box { flex: 1; background: #333; color: #fff; padding: 15px; border-radius: 8px; text-align: center; }
    .amount-label { font-size: 0.9rem; margin-bottom: 5px; }
    .amount-value { font-size: 1.8rem; font-weight: bold; }
    
    /* ボタン類 */
    .action-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
    .action-buttons button { flex: 1; padding: 15px; font-size: 1rem; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: #fff; }
    .btn-add-match { background: #00b2a9; }
    .btn-add-bonus { background: #fbc02d; color: #333 !important; }
    button.submit-btn { width: 100%; background: #00b2a9; color: #fff; border: none; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
    button.submit-bonus-btn { width: 100%; background: #fbc02d; color: #333; border: none; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
    button.cancel-btn { width: 100%; background: #e0e0e0; color: #333; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
    button.settle-btn { width: 100%; background: #ffc107; color: #333; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
    
    /* カレンダー */
    .calendar { margin: 20px 0; background: #fff; border-radius: 8px; padding: 15px; border: 1px solid #eee; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .calendar-header button { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #c8102e; padding: 5px 10px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .calendar-day-header { font-size: 0.8rem; color: #666; font-weight: bold; padding-bottom: 5px; }
    .calendar-cell { border: 1px solid #eee; border-radius: 6px; padding: 5px 2px; min-height: 55px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; cursor: pointer; }
    .calendar-cell.has-data { background-color: #fff9e6; border-color: #ffe082; }
    .calendar-cell.today { border: 2px solid #00b2a9; }
    .calendar-cell:active { background-color: #f0f0f0; }
    .calendar-date { font-weight: bold; font-size: 0.85rem; margin-bottom: 2px; }
    .calendar-badge { background: #c8102e; color: #fff; font-size: 0.65rem; padding: 2px 4px; border-radius: 4px; width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }

    /* モーダル (詳細ポップアップ) */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #fff; width: 90%; max-width: 450px; border-radius: 12px; padding: 20px; max-height: 85vh; overflow-y: auto; position: relative; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
    .modal-header h3 { margin: 0; color: #c8102e; font-size: 1.1rem; }
    .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999; padding: 0 5px; }
    
    /* フォーム項目 */
    .section { border-bottom: 1px solid #eee; padding: 15px 0; }
    .bonus-section { background-color: #fff9e6; border: 1px solid #ffe082; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .section h3, .bonus-section h3 { margin: 0 0 10px; font-size: 1.1rem; color: #c8102e; }
    .bonus-section h3 { color: #d48b00; }
    label { display: block; margin-bottom: 8px; font-size: 0.95rem; font-weight: bold; }
    select, input[type="number"], input[type="date"] { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    optgroup { font-weight: bold; color: #555; }
    .score-inputs { display: flex; gap: 15px; }
    .score-inputs label { flex: 1; }
    .checkbox-group label { display: block; margin-bottom: 10px; font-weight: normal; cursor: pointer; }
    .checkbox-group input { transform: scale(1.2); margin-right: 8px; }
    .form-actions { margin-top: 25px; display: flex; flex-direction: column; gap: 10px; }
    
    /* 履歴リスト */
    .history { margin-top: 20px; }
    .history h3 { color: #333; border-bottom: 2px solid #c8102e; padding-bottom: 5px; margin-bottom: 15px; font-size: 1.1rem; }
    .history-item { background: #fafafa; border-left: 4px solid #c8102e; padding: 12px; border-radius: 4px; margin-bottom: 10px; font-size: 0.9rem; }
    .history-item.settlement { background: #fff3cd; border-left: 4px solid #ffc107; }
    .history-item.special-bonus { border-left: 4px solid #fbc02d; background: #fffde7; }
    .status-badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
    .status-unsettled { background: #ffebee; color: #c8102e; }
    .status-settled { background: #e0f2f1; color: #00796b; }
    .history-actions { margin-top: 10px; text-align: right; }
    .history-actions button { padding: 5px 12px; margin-left: 8px; font-size: 0.8rem; border-radius: 4px; cursor: pointer; border: 1px solid #ccc; background: #fff; }
    .history-actions button.edit-btn { color: #00796b; border-color: #00796b; }
    .history-actions button.delete-btn { color: #c8102e; border-color: #c8102e; }
  </style>
</head>
<body>

<div class="container">

  <!-- ▼ 一覧（ダッシュボード）画面 ▼ -->
  <div id="view-dashboard" class="view-section active">
    <!-- 🌟 ヘッダーをダッシュボード内のみに配置（入力画面では消えます） -->
    <header>
      <h1>Liverpool貯金</h1>
    </header>

    <div class="dashboard">
      <div class="total-box">
        <div class="amount-label">シーズン累計</div>
        <div class="amount-value"><span id="totalDisplay">0</span> 円</div>
      </div>
      <div class="unsettled-box">
        <div class="amount-label">未精算（まとめ額）</div>
        <div class="amount-value"><span id="unsettledDisplay">0</span> 円</div>
      </div>
    </div>

    <button type="button" class="settle-btn" onclick="executeSettlement()">💰 15日/月末の精算を完了する</button>

    <div class="action-buttons">
      <button type="button" class="btn-add-match" onclick="openMatchForm()">⚽ 試合結果を追加</button>
      <button type="button" class="btn-add-bonus" onclick="openBonusForm()">🏆 特別ボーナス追加</button>
    </div>

    <!-- 🌟 カレンダーUI -->
    <div class="calendar">
      <div class="calendar-header">
        <button type="button" onclick="changeMonth(-1)">◀</button>
        <h3 id="calendarMonth" style="margin:0; font-size:1.1rem; color:#333;"></h3>
        <button type="button" onclick="changeMonth(1)">▶</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="history">
      <h3>最近の記録 (直近10件)</h3>
      <div id="historyList"></div>
    </div>
  </div>
  <!-- ▲ 一覧（ダッシュボード）画面 終了 ▲ -->


  <!-- ▼ 試合結果 入力・編集フォーム画面 ▼ -->
  <div id="view-match-form" class="view-section">
    <h2 id="matchFormTitle" style="text-align:center; color:#c8102e; margin-top:10px;">試合結果の入力</h2>
    <form id="matchForm">
      <div class="section">
        <h3>① 試合結果</h3>
        <!-- 🌟 試合日タブの幅を狭く（style="width: 160px;" を追加） -->
        <label>試合日
          <input type="date" id="matchDate" required style="width: 160px;">
        </label>
        <label>大会
          <select id="competition">
            <option value="PL">プレミアリーグ</option>
            <option value="CL">チャンピオンズリーグ</option>
            <option value="FA">FAカップ</option>
            <option value="EFL">カラバオカップ</option>
          </select>
        </label>
        <label>対戦相手
          <select id="opponent">
            <option value="other">その他</option>
            <option value="MU">マンチェスター・ユナイテッド</option>
            <option value="CHE">チェルシー</option>
            <option value="TOT">トッテナム</option>
            <option value="MCI">マンチェスター・シティ</option>
            <option value="ARS">アーセナル</option>
            <option value="EVE">エヴァートン (ダービー)</option>
          </select>
        </label>
        <div class="score-inputs">
          <label>LFC 得点 <input type="number" id="gf" min="0" value="0"></label>
          <label>相手 失点 <input type="number" id="ga" min="0" value="0"></label>
        </div>
      </div>

      <div class="section checkbox-group">
        <h3>② 選手・プレーボーナス</h3>
        <label><input type="checkbox" id="hattrick"> ハットトリック (+1,000円)</label>
        <label><input type="checkbox" id="lateWinner"> 90分以降の決勝ゴール (+500円)</label>
        <label><input type="checkbox" id="directFK"> 直接FKゴール (+500円)</label>
        <label><input type="checkbox" id="academyGoal"> アカデミー選手のゴール (+500円)</label>
        <label><input type="checkbox" id="pkStop"> GKのPKストップ (+500円)</label>
        <label><input type="checkbox" id="gomezGoal"> ★ジョー・ゴメスのゴール (+10,000円)</label>
      </div>

      <div class="section">
        <h3>③ お仕置き貯金 (ペナルティ)</h3>
        <label>退場者数 (1人につき +500円)
          <input type="number" id="redCards" min="0" value="0">
        </label>
      </div>

      <div class="form-actions">
        <button type="button" class="submit-btn" onclick="saveMatch()">記録を保存する</button>
        <button type="button" class="cancel-btn" onclick="showDashboard()">キャンセル</button>
      </div>
    </form>
  </div>
  <!-- ▲ 試合結果 入力・編集フォーム画面 終了 ▲ -->


  <!-- ▼ 特別ボーナス 入力・編集フォーム画面 ▼ -->
  <div id="view-bonus-form" class="view-section">
    <h2 id="bonusFormTitle" style="text-align:center; color:#d48b00; margin-top:10px;">特別ボーナスの入力</h2>
    <div class="bonus-section">
      <!-- 🌟 日付タブの幅を狭く -->
      <label>発生日
        <input type="date" id="bonusDate" required style="width: 160px;">
      </label>
      <label>項目を選択
        <select id="specialBonus">
          <optgroup label="① チャンピオンズリーグ (CL)">
            <option value="2000_CL 決勝トーナメント進出">CL 決勝トーナメント進出 (+2,000円)</option>
            <option value="2000_CL ベスト8進出">CL ベスト8進出 (+2,000円)</option>
            <option value="3000_CL ベスト4進出">CL ベスト4進出 (+3,000円)</option>
            <option value="5000_CL 決勝進出">CL 決勝進出 (+5,000円)</option>
            <option value="10000_CL 優勝">CL 優勝 (+10,000円)</option>
          </optgroup>
          <optgroup label="② 国内カップ戦">
            <option value="2000_FAカップ 決勝進出">FAカップ 決勝進出 (+2,000円)</option>
            <option value="5000_FAカップ 優勝">FAカップ 優勝 (+5,000円)</option>
            <option value="1000_カラバオカップ 決勝進出">カラバオカップ 決勝進出 (+1,000円)</option>
            <option value="3000_カラバオカップ 優勝">カラバオカップ 優勝 (+3,000円)</option>
          </optgroup>
          <optgroup label="③ シーズン終了ボーナス">
            <option value="10000_プレミアリーグ 優勝">プレミアリーグ 優勝 (+10,000円)</option>
            <option value="3000_プレミアリーグ TOP4">プレミアリーグ TOP4フィニッシュ (+3,000円)</option>
            <option value="3000_PL得点王 (LFCから)">PL得点王 (LFCから) (+3,000円)</option>
            <option value="3000_PFA年間最優秀選手 (LFCから)">PFA年間最優秀選手賞 (LFCから) (+3,000円)</option>
            <option value="-5000_シーズン無冠">シーズン無冠 (-5,000円)</option>
          </optgroup>
        </select>
      </label>
    </div>
    <div class="form-actions">
      <button type="button" class="submit-bonus-btn" onclick="saveSpecialBonus()">ボーナスを保存する</button>
      <button type="button" class="cancel-btn" onclick="showDashboard()">キャンセル</button>
    </div>
  </div>
  <!-- ▲ 特別ボーナス 入力・編集フォーム画面 終了 ▲ -->

</div>

<!-- 🌟 カレンダーの日付タップ用 モーダル(ポップアップ) -->
<div id="dateModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalDateTitle">日付の詳細</h3>
      <button class="close-btn" onclick="closeDateDetails()">×</button>
    </div>
    <div id="modalContentBody" class="modal-body">
      <!-- ここに選択した日付の記録リストが入ります -->
    </div>
  </div>
</div>

<script>
  let logs = JSON.parse(localStorage.getItem('lfc_savings_26_27')) || [];
  let editingIndex = -1; 
  let currentCalendarDate = new Date();

  // --- 画面切り替えロジック ---
  function showView(viewId) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    window.scrollTo(0, 0); 
  }

  function showDashboard() {
    updateUI();
    showView('view-dashboard');
    editingIndex = -1;
  }

  function getTodayString() {
    const today = new Date();
    return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  }

  // --- 試合結果フォームの処理 ---
  function openMatchForm(index = -1) {
    editingIndex = index;
    const form = document.getElementById('matchForm');
    
    if (index === -1) {
      document.getElementById('matchFormTitle').textContent = '試合結果の記録';
      form.reset();
      document.getElementById('matchDate').value = getTodayString();
    } else {
      document.getElementById('matchFormTitle').textContent = '試合結果の編集';
      const log = logs[index];
      if (!log.rawData) { alert("古い形式のデータのため編集できません。"); return; }
      const r = log.rawData;
      document.getElementById('matchDate').value = r.matchDate || getTodayString();
      document.getElementById('competition').value = r.competition;
      document.getElementById('opponent').value = r.opponent;
      document.getElementById('gf').value = r.gf;
      document.getElementById('ga').value = r.ga;
      document.getElementById('redCards').value = r.redCards;
      document.getElementById('hattrick').checked = r.hattrick;
      document.getElementById('lateWinner').checked = r.lateWinner;
      document.getElementById('directFK').checked = r.directFK;
      document.getElementById('academyGoal').checked = r.academyGoal;
      document.getElementById('pkStop').checked = r.pkStop;
      document.getElementById('gomezGoal').checked = r.gomezGoal;
    }
    showView('view-match-form');
  }

  function saveMatch() {
    const matchDateStr = document.getElementById('matchDate').value || getTodayString();
    const comp = document.getElementById('competition').value;
    const opp = document.getElementById('opponent').value;
    const gf = parseInt(document.getElementById('gf').value) || 0;
    const ga = parseInt(document.getElementById('ga').value) || 0;
    const redCards = parseInt(document.getElementById('redCards').value) || 0;

    const hattrick = document.getElementById('hattrick').checked;
    const lateWinner = document.getElementById('lateWinner').checked;
    const directFK = document.getElementById('directFK').checked;
    const academyGoal = document.getElementById('academyGoal').checked;
    const pkStop = document.getElementById('pkStop').checked;
    const gomezGoal = document.getElementById('gomezGoal').checked;

    let amount = 0;
    let details = [];

    if (gf > ga) {
      amount += 500; details.push('勝利 (+500)');
      if (comp === 'CL') { amount += 500; details.push('CL勝利 (+500)'); }
    } else if (gf === ga) {
      amount += 100; details.push('引き分け (+100)');
    } else {
      amount += 500; details.push('敗戦 (+500)');
      if ((ga - gf) >= 3) { amount += 1000; details.push('3点差以上敗戦 (+1,000)'); }
      if (opp === 'MU') { amount += 1000; details.push('ユナイテッド敗戦 (+1,000)'); }
      if (opp === 'EVE') { amount += 1000; details.push('エヴァートン敗戦 (+1,000)'); }
    }

    if (gf > 0) { amount += gf * 100; details.push(`ゴールx${gf} (+${gf * 100})`); }
    if (ga === 0) { amount += 200; details.push('クリーンシート (+200)'); }
    if (ga >= 3) { amount += 500; details.push('3失点以上 (+500)'); }

    if (comp === 'PL' && gf > ga) {
      if (['MU', 'CHE', 'TOT'].includes(opp)) { amount += 500; details.push('対BIG6勝利 (+500)'); }
      if (['MCI', 'ARS', 'EVE'].includes(opp)) { amount += 1000; details.push('対BIG6/ダービー勝利 (+1,000)'); }
    }

    if (hattrick) { amount += 1000; details.push('ハットトリック (+1,000)'); }
    if (lateWinner) { amount += 500; details.push('90分以降決勝弾 (+500)'); }
    if (directFK) { amount += 500; details.push('直接FK (+500)'); }
    if (academyGoal) { amount += 500; details.push('アカデミー弾 (+500)'); }
    if (pkStop) { amount += 500; details.push('PKストップ (+500)'); }
    if (gomezGoal) { amount += 10000; details.push('ジョー・ゴメス弾 (+10,000)'); }
    if (redCards > 0) { amount += redCards * 500; details.push(`退場者x${redCards} (+${redCards * 500})`); }

    const rawData = { matchDate: matchDateStr, competition: comp, opponent: opp, gf, ga, redCards, hattrick, lateWinner, directFK, academyGoal, pkStop, gomezGoal };
    const recordDate = new Date(matchDateStr).toLocaleDateString('ja-JP');
    const isSettled = editingIndex >= 0 ? logs[editingIndex].isSettled : false;
    const entry = { type: 'match', date: recordDate, score: `${gf} - ${ga}`, amount, details: details.join(' / '), isSettled, rawData };

    if (editingIndex >= 0) { logs[editingIndex] = entry; } else { logs.unshift(entry); }
    
    saveData();
    showDashboard();
  }

  // --- 特別ボーナスフォームの処理 ---
  function openBonusForm(index = -1) {
    editingIndex = index;
    if (index === -1) {
      document.getElementById('bonusFormTitle').textContent = '特別ボーナスの記録';
      document.getElementById('bonusDate').value = getTodayString();
      document.getElementById('specialBonus').selectedIndex = 0;
    } else {
      document.getElementById('bonusFormTitle').textContent = '特別ボーナスの編集';
      const log = logs[index];
      if (!log.rawData) { alert("古い形式のため編集できません。"); return; }
      document.getElementById('bonusDate').value = log.rawData.bonusDate || getTodayString();
      document.getElementById('specialBonus').value = log.rawData.specialBonusValue;
    }
    showView('view-bonus-form');
  }

  function saveSpecialBonus() {
    const bonusDateStr = document.getElementById('bonusDate').value || getTodayString();
    const rawVal = document.getElementById('specialBonus').value;
    const parts = rawVal.split('_'); 
    const amount = parseInt(parts[0]);
    const details = parts[1];

    const rawData = { bonusDate: bonusDateStr, specialBonusValue: rawVal };
    const recordDate = new Date(bonusDateStr).toLocaleDateString('ja-JP');
    const isSettled = editingIndex >= 0 ? logs[editingIndex].isSettled : false;
    const entry = { type: 'bonus', date: recordDate, score: 'ボーナス', amount, details, isSettled, rawData };

    if (editingIndex >= 0) { logs[editingIndex] = entry; } else { logs.unshift(entry); }
    
    saveData();
    showDashboard();
  }

  // --- カレンダー・モーダル・その他の処理 ---
  function executeSettlement() {
    const unsettledLogs = logs.filter(item => (item.type !== 'settlement' && !item.isSettled));
    if (unsettledLogs.length === 0) { alert("精算する未精算の記録がありません。"); return; }
    const settleAmount = unsettledLogs.reduce((sum, item) => sum + item.amount, 0);
    
    if(confirm(`未精算額 ${settleAmount.toLocaleString()}円 を精算完了にしますか？`)) {
      logs.forEach(item => {
        if (item.type !== 'settlement' && !item.isSettled) { item.isSettled = true; }
      });
      logs.unshift({
        type: 'settlement', date: new Date().toLocaleDateString('ja-JP'), amount: settleAmount, details: '未精算分の金額をまとめました'
      });
      saveData();
      showDashboard();
    }
  }

  function editLogRouter(index) {
    closeDateDetails(); // モーダルが開いていれば閉じる
    const type = logs[index].type;
    if (type === 'match') openMatchForm(index);
    else if (type === 'bonus') openBonusForm(index);
  }

  function deleteLog(index) {
    if (confirm("この記録を削除してもよろしいですか？")) {
      logs.splice(index, 1);
      saveData();
      closeDateDetails(); // モーダルが開いていれば閉じる
      showDashboard();
    }
  }

  function saveData() {
    localStorage.setItem('lfc_savings_26_27', JSON.stringify(logs));
  }

  // 1件分のHTMLを生成する関数（履歴リストとモーダルの両方で使う）
  function generateHistoryItemHTML(item, index) {
    let actionButtons = '';
    if (item.type !== 'settlement' && !item.isSettled) {
      actionButtons = `
        <div class="history-actions">
          <button type="button" class="edit-btn" onclick="editLogRouter(${index})">✏️ 編集</button>
          <button type="button" class="delete-btn" onclick="deleteLog(${index})">🗑️ 削除</button>
        </div>
      `;
    }

    if (item.type === 'settlement') {
      return `<div class="history-item settlement"><strong>${item.date} : 💰 精算完了 ＋${item.amount.toLocaleString()}円</strong><br><span style="color:#666;">${item.details}</span>${actionButtons}</div>`;
    } else if (item.type === 'bonus') {
      const badge = item.isSettled ? `<span class="status-badge status-settled">精算済</span>` : `<span class="status-badge status-unsettled">未精算</span>`;
      const amountSign = item.amount > 0 ? '＋' : '';
      return `<div class="history-item special-bonus"><strong>${item.date} [🏆 特別] : ${amountSign}${item.amount.toLocaleString()}円 ${badge}</strong><br><span style="color:#666;">${item.details}</span>${actionButtons}</div>`;
    } else {
      const badge = item.isSettled ? `<span class="status-badge status-settled">精算済</span>` : `<span class="status-badge status-unsettled">未精算</span>`;
      return `<div class="history-item"><strong>${item.date} [${item.score}] : ＋${item.amount.toLocaleString()}円 ${badge}</strong><br><span style="color:#666;">${item.details}</span>${actionButtons}</div>`;
    }
  }

  // カレンダーを描画
  function renderCalendar() {
    const year = currentCalendarDate.getFullYear();
    const month = currentCalendarDate.getMonth();
    
    document.getElementById('calendarMonth').textContent = `${year}年 ${month + 1}月`;
    
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    
    let html = `
      <div class="calendar-day-header">日</div><div class="calendar-day-header">月</div><div class="calendar-day-header">火</div>
      <div class="calendar-day-header">水</div><div class="calendar-day-header">木</div><div class="calendar-day-header">金</div><div class="calendar-day-header">土</div>
    `;
    
    for (let i = 0; i < firstDay; i++) {
      html += `<div class="calendar-cell" style="border:none; background:transparent;"></div>`;
    }
    
    const todayStr = new Date().toDateString();

    for (let d = 1; d <= lastDate; d++) {
      const dateObj = new Date(year, month, d);
      const dateStrForCompare = dateObj.toDateString();
      
      // その日のログを検索
      const daysLogs = logs.filter(item => new Date(item.date).toDateString() === dateStrForCompare);
      const amountSum = daysLogs.reduce((sum, item) => sum + item.amount, 0);
      
      let cellClass = "calendar-cell";
      let badgeHtml = "";
      
      if (daysLogs.length > 0) {
        cellClass += " has-data";
        const sign = amountSum >= 0 ? '+' : '';
        badgeHtml = `<div class="calendar-badge">${sign}${amountSum.toLocaleString()}</div>`;
      }
      if (dateStrForCompare === todayStr) { cellClass += " today"; }
      
      html += `<div class="${cellClass}" onclick="openDateDetails('${year}/${month+1}/${d}')">
        <div class="calendar-date">${d}</div>
        ${badgeHtml}
      </div>`;
    }
    document.getElementById('calendarGrid').innerHTML = html;
  }

  function changeMonth(diff) {
    currentCalendarDate.setMonth(currentCalendarDate.getMonth() + diff);
    renderCalendar();
  }

  // カレンダーの日付タップ時にモーダルを開く
  function openDateDetails(dateStr) {
    const targetDateObj = new Date(dateStr);
    document.getElementById('modalDateTitle').textContent = `${targetDateObj.getFullYear()}年${targetDateObj.getMonth()+1}月${targetDateObj.getDate()}日 の記録`;
    const targetDateString = targetDateObj.toDateString();
    
    let html = '';
    let count = 0;
    
    // 一致する日付のログを探してHTML生成（indexは本来の配列位置を渡す）
    logs.forEach((item, index) => {
      if (new Date(item.date).toDateString() === targetDateString) {
        html += generateHistoryItemHTML(item, index);
        count++;
      }
    });

    if (count === 0) {
      html = `<p style="text-align:center; color:#666; margin: 30px 0;">この日の記録はありません。</p>`;
    }
    
    document.getElementById('modalContentBody').innerHTML = html;
    document.getElementById('dateModal').classList.add('active');
  }

  function closeDateDetails() {
    document.getElementById('dateModal').classList.remove('active');
  }

  // 画面全体の描画更新
  function updateUI() {
    const matchLogs = logs.filter(item => item.type !== 'settlement');
    const total = matchLogs.reduce((sum, item) => sum + item.amount, 0);
    const unsettled = matchLogs.filter(item => !item.isSettled).reduce((sum, item) => sum + item.amount, 0);
    
    document.getElementById('totalDisplay').textContent = total.toLocaleString();
    document.getElementById('unsettledDisplay').textContent = unsettled.toLocaleString();

    // カレンダーの更新
    renderCalendar();

    // ダッシュボードの履歴は直近10件だけ表示してスッキリさせる
    const historyEl = document.getElementById('historyList');
    historyEl.innerHTML = logs.slice(0, 10).map((item, index) => generateHistoryItemHTML(item, index)).join('');
  }

  // 初期表示処理
  showDashboard();
</script>
</body>
</html>
